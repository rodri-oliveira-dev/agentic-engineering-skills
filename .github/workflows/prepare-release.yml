name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable SemVer without v prefix, e.g. 1.0.1'
        required: true
        type: string
      notes:
        description: 'Factual Markdown notes for the proposed version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate, bump version and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Verify source is main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Release preparation must be dispatched from main.' >&2
            exit 1
          fi

      - name: Check out approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Reject existing release tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Invalid stable SemVer (no v prefix).' >&2
            exit 1
          fi
          require_absent_api_resource() {
            local path="$1"
            local status
            status=$(curl --silent --show-error --max-time 20 \
              --output "$RUNNER_TEMP/release-api-response.json" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$path")
            if [[ "$status" != '404' ]]; then
              echo "Expected 404 for $path, got HTTP $status. Refusing release." >&2
              exit 1
            fi
          }
          require_absent_api_resource "git/ref/tags/$RELEASE_VERSION"
          require_absent_api_resource "releases/tags/$RELEASE_VERSION"

      - name: Update canonical version and proposed notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          python scripts/release_automation.py prepare --version "$RELEASE_VERSION" --notes "$RELEASE_NOTES"
          python scripts/release_automation.py check --version "$RELEASE_VERSION"

      - name: Validate candidate before creating a PR
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -v
          python scripts/validate_skills.py --require-skills
          python scripts/package_plugins.py check
          python scripts/package_plugins.py verify
          python scripts/evaluate_scenarios.py check

      - name: Commit changes to a new release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/prepare-$RELEASE_VERSION"
          git switch -c "$BRANCH"
          git add -- scripts/package_plugins.py .agents/plugins/marketplace.json \
            .github/plugin/marketplace.json .claude-plugin/marketplace.json \
            plugins/agentic-engineering/ "docs/releases/$RELEASE_VERSION-notes.md"
          if git diff --cached --quiet; then
            echo 'Version preparation did not change any tracked files.' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(release): prepare $RELEASE_VERSION"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"

          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ## Proposed version $RELEASE_VERSION

          This PR updates the version source, generated manifests and package, and includes maintainer-supplied release notes.
          It does not publish a tag or a release.

          ## Reviewer checklist
          - [ ] Verify actual change history supports the release notes.
          - [ ] Confirm structural tests and both required validation environments.
          - [ ] Review supply-chain audit evidence and the risk register.
          - [ ] Merge only after approval. Run Publish release separately from main.

          GitHub Actions explicitly dispatches both validation workflows because the PR is created using GITHUB_TOKEN.
          EOF

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(release): prepare $RELEASE_VERSION" \
            --body-file "$RUNNER_TEMP/release-pr.md" --draft

      - name: Dispatch checks against the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/prepare-$RELEASE_VERSION"
          gh workflow run validate-skills.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
          gh workflow run security-audit.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
          echo "Validation dispatched. Review the check results on the release PR before merge."
