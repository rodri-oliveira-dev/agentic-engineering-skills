name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Previously merged stable SemVer, e.g. 1.0.1 (no v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check approved release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require main workflow_dispatch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Publishing requires workflow_dispatch from main.' >&2
            exit 1
          fi
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate release version, notes and generated package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_automation.py check --version "$RELEASE_VERSION"
          python scripts/package_plugins.py check
          python scripts/package_plugins.py verify
      - name: Reject an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Tag already exists.' >&2
            exit 1
          fi

  audit:
    name: Supply-chain validation
    needs: preflight
    uses: ./.github/workflows/security-audit.yml
    permissions:
      contents: read

  release-package:
    name: Build and stage release (read-only)
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.stage.outputs.artifact-id }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate and build deterministic ZIP, checksum and notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_automation.py check --version "$RELEASE_VERSION"
          python scripts/package_plugins.py check
          python scripts/package_plugins.py verify
          python scripts/supply_chain_evidence.py package --tag "$RELEASE_VERSION" \
            --output "dist/agentic-engineering-$RELEASE_VERSION.zip"
          cp "docs/releases/$RELEASE_VERSION-notes.md" dist/release-notes.md
          (
            cd dist
            sha256sum -c "agentic-engineering-$RELEASE_VERSION.zip.sha256"
          )
      - name: Stage immutable candidate artifact
        id: stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            dist/agentic-engineering-*.zip
            dist/agentic-engineering-*.zip.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Verify attestation and publish (privileged)
    needs: release-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact candidate by artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release-package.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Verify archive, checksum, tag absence and unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Invalid release version.' >&2
            exit 1
          fi
          test -s "dist/agentic-engineering-$RELEASE_VERSION.zip"
          test -s "dist/agentic-engineering-$RELEASE_VERSION.zip.sha256"
          test -s dist/release-notes.md
          (
            cd dist
            sha256sum -c "agentic-engineering-$RELEASE_VERSION.zip.sha256"
          )
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$CURRENT_MAIN" != "$GITHUB_SHA" ]]; then
            echo 'Main advanced; rerun Publish release from current main.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Existing release tag cannot be overwritten.' >&2
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release cannot be overwritten.' >&2
            exit 1
          fi
      - name: Enforce patched GitHub CLI for signer verification
        run: |
          GH_VERSION=$(gh --version | head -n1 | awk '{print $3}')
          if [[ "$(printf '%s\n' '2.102.0' "$GH_VERSION" | sort -V | head -n1)" != '2.102.0' ]]; then
            echo "GitHub CLI $GH_VERSION is too old (minimum 2.102.0)." >&2
            exit 1
          fi
      - name: Attest exact archive using GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/agentic-engineering-*.zip
      - name: Verify cryptographic provenance before release creation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ARTIFACT="dist/agentic-engineering-$RELEASE_VERSION.zip"
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/heads/main"
          verified=0
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$ARTIFACT" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$IDENTITY" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --format json > dist/attestation-verification.json; then
              verified=1
              break
            fi
            sleep 3
          done
          if [[ "$verified" != '1' ]]; then
            echo 'Attestation was not verifiable for this workflow, SHA and artifact.' >&2
            exit 1
          fi
          jq -e 'type == "array" and length > 0' dist/attestation-verification.json >/dev/null
          cat >> dist/release-notes.md <<EOF

          ---
          Provenance: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Source commit: $GITHUB_SHA
          This release provides an attested ZIP and a SHA-256 checksum.
          EOF
      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "dist/agentic-engineering-$RELEASE_VERSION.zip" \
            "dist/agentic-engineering-$RELEASE_VERSION.zip.sha256" \
            dist/attestation-verification.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --notes-file dist/release-notes.md --draft
      - name: Download draft assets and compare published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "agentic-engineering-$RELEASE_VERSION.zip*" \
            --dir "$RUNNER_TEMP/release-readback"
          (
            cd "$RUNNER_TEMP/release-readback"
            sha256sum -c "agentic-engineering-$RELEASE_VERSION.zip.sha256"
          )
          cmp "dist/agentic-engineering-$RELEASE_VERSION.zip" \
            "$RUNNER_TEMP/release-readback/agentic-engineering-$RELEASE_VERSION.zip"
          cmp "dist/agentic-engineering-$RELEASE_VERSION.zip.sha256" \
            "$RUNNER_TEMP/release-readback/agentic-engineering-$RELEASE_VERSION.zip.sha256"
      - name: Publish after successful artifact readback
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json url,isDraft,tagName,assets \
            --jq '{url, isDraft, tagName, assetNames: [.assets[].name]}'
