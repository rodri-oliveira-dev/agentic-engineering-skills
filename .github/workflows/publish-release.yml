name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Previously merged stable SemVer, e.g. 1.0.1 (no v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check approved release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require main workflow_dispatch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Publishing requires workflow_dispatch from main.' >&2
            exit 1
          fi
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate release version, notes and generated package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_automation.py check --version "$RELEASE_VERSION"
          python scripts/package_plugins.py check
          python scripts/package_plugins.py verify
      - name: Reject an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          require_absent_api_resource() {
            local path="$1"
            local status
            status=$(curl --silent --show-error --max-time 20 \
              --output "$RUNNER_TEMP/release-api-response.json" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$path")
            if [[ "$status" != '404' ]]; then
              echo "Expected 404 for $path, got HTTP $status. Refusing release." >&2
              exit 1
            fi
          }
          require_absent_api_resource "git/ref/tags/$RELEASE_VERSION"
          require_absent_api_resource "releases/tags/$RELEASE_VERSION"
          # GitHub does not expose unpublished drafts through the by-tag endpoint.
          # Check the release collection as well, otherwise a failed draft can be ignored.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg tag "$RELEASE_VERSION" '[.[] | select(.tag_name == $tag)] | length')
          if [[ "$existing" != '0' ]]; then
            echo "A release or draft for $RELEASE_VERSION already exists. Use Recover release draft after reviewing its assets." >&2
            exit 1
          fi

  audit:
    name: Supply-chain validation
    needs: preflight
    uses: ./.github/workflows/security-audit.yml
    permissions:
      contents: read

  release-package:
    name: Build and stage release (read-only)
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.stage.outputs.artifact-id }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate and build deterministic ZIP, checksum and notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_automation.py check --version "$RELEASE_VERSION"
          python scripts/package_plugins.py check
          python scripts/package_plugins.py verify
          python scripts/supply_chain_evidence.py package --tag "$RELEASE_VERSION" \
            --output "dist/agentic-engineering-$RELEASE_VERSION.zip"
          cp "docs/releases/$RELEASE_VERSION-notes.md" dist/release-notes.md
          (
            cd dist
            sha256sum -c "agentic-engineering-$RELEASE_VERSION.zip.sha256"
          )
      - name: Stage immutable candidate artifact
        id: stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            dist/agentic-engineering-*.zip
            dist/agentic-engineering-*.zip.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Verify attestation and publish (privileged)
    needs: release-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact candidate by artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release-package.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Verify archive, checksum, tag absence and unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Invalid release version.' >&2
            exit 1
          fi
          test -s "dist/agentic-engineering-$RELEASE_VERSION.zip"
          test -s "dist/agentic-engineering-$RELEASE_VERSION.zip.sha256"
          test -s dist/release-notes.md
          (
            cd dist
            sha256sum -c "agentic-engineering-$RELEASE_VERSION.zip.sha256"
          )
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$CURRENT_MAIN" != "$GITHUB_SHA" ]]; then
            echo 'Main advanced; rerun Publish release from current main.' >&2
            exit 1
          fi
          require_absent_api_resource() {
            local path="$1"
            local status
            status=$(curl --silent --show-error --max-time 20 \
              --output "$RUNNER_TEMP/release-api-response.json" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$path")
            if [[ "$status" != '404' ]]; then
              echo "Expected 404 for $path, got HTTP $status. Refusing release." >&2
              exit 1
            fi
          }
          require_absent_api_resource "git/ref/tags/$RELEASE_VERSION"
          require_absent_api_resource "releases/tags/$RELEASE_VERSION"
      - name: Enforce patched GitHub CLI for signer verification
        run: |
          GH_VERSION=$(gh --version | head -n1 | awk '{print $3}')
          if [[ "$(printf '%s\n' '2.102.0' "$GH_VERSION" | sort -V | head -n1)" != '2.102.0' ]]; then
            echo "GitHub CLI $GH_VERSION is too old (minimum 2.102.0)." >&2
            exit 1
          fi
      - name: Attest exact archive using GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/agentic-engineering-*.zip
      - name: Verify cryptographic provenance before release creation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ARTIFACT="dist/agentic-engineering-$RELEASE_VERSION.zip"
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/heads/main"
          verified=0
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$ARTIFACT" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$IDENTITY" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --format json > dist/attestation-verification.json; then
              verified=1
              break
            fi
            sleep 3
          done
          if [[ "$verified" != '1' ]]; then
            echo 'Attestation was not verifiable for this workflow, SHA and artifact.' >&2
            exit 1
          fi
          jq -e 'type == "array" and length > 0' dist/attestation-verification.json >/dev/null
          cat >> dist/release-notes.md <<EOF

          ---
          Provenance: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Source commit: $GITHUB_SHA
          This release provides an attested ZIP and a SHA-256 checksum.
          EOF
      - name: Create draft release with verified assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "dist/agentic-engineering-$RELEASE_VERSION.zip" \
            "dist/agentic-engineering-$RELEASE_VERSION.zip.sha256" \
            dist/attestation-verification.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --notes-file dist/release-notes.md --draft

          # Drafts have a release ID, but the Git tag need not exist yet.
          release_list=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          release_id=$(jq -r --arg tag "$RELEASE_VERSION" --arg commit "$GITHUB_SHA" '
            [.[] | select(.tag_name == $tag and .draft == true and .target_commitish == $commit)]
            | if length == 1 then .[0].id else empty end
          ' <<< "$release_list")
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Could not uniquely identify the newly created draft; manual recovery is required." >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Download draft assets by release ID and compare published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          DRAFT_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          if ! [[ "$DRAFT_ID" =~ ^[0-9]+$ ]]; then
            echo "Missing numeric draft ID" >&2
            exit 1
          fi
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID")
          jq -e --arg tag "$RELEASE_VERSION" --arg commit "$GITHUB_SHA" '
            .draft == true and .tag_name == $tag and .target_commitish == $commit and
            ((.assets | map(.name) | sort) ==
             (["agentic-engineering-" + $tag + ".zip",
               "agentic-engineering-" + $tag + ".zip.sha256",
               "attestation-verification.json"] | sort)) and
            (.assets | all(.state == "uploaded"))
          ' <<< "$metadata" >/dev/null

          mkdir -p "$RUNNER_TEMP/release-readback"
          for name in "agentic-engineering-$RELEASE_VERSION.zip" \
                      "agentic-engineering-$RELEASE_VERSION.zip.sha256" \
                      "attestation-verification.json"; do
            asset_id=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<< "$metadata")
            if ! [[ "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "Missing draft asset ID for $name" >&2
              exit 1
            fi
            downloaded="$RUNNER_TEMP/release-readback/$name"
            curl --fail --silent --show-error --location --retry 3 --max-time 90 \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              --output "$downloaded"
            local_digest=$(sha256sum "$downloaded" | awk '{print $1}')
            published_digest=$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .digest' <<< "$metadata")
            if [[ "$published_digest" != "sha256:$local_digest" ]]; then
              echo "GitHub metadata digest mismatch for $name" >&2
              exit 1
            fi
            cmp "dist/$name" "$downloaded"
          done
          (
            cd "$RUNNER_TEMP/release-readback"
            sha256sum -c "agentic-engineering-$RELEASE_VERSION.zip.sha256"
          )

      - name: Publish verified draft and verify newly created Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          DRAFT_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          # Publishing is not atomic; failures here require inspecting the Release.
          published=$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
            -F draft=false)
          jq -e --arg tag "$RELEASE_VERSION" --arg commit "$GITHUB_SHA" '
            .draft == false and .tag_name == $tag and
            .target_commitish == $commit and .published_at != null
          ' <<< "$published" >/dev/null

          tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION")
          tag_type=$(jq -r '.object.type' <<< "$tag_json")
          tag_sha=$(jq -r '.object.sha' <<< "$tag_json")
          if [[ "$tag_type" == 'tag' ]]; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          elif [[ "$tag_type" != 'commit' ]]; then
            echo "Unexpected tag object type after publication" >&2
            exit 1
          fi
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Published Git tag does not resolve to the validated source commit" >&2
            exit 1
          fi
          echo "Published verified release $RELEASE_VERSION from $GITHUB_SHA"
