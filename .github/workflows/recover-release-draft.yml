name: Recover verified release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing draft stable version, e.g. 1.0.1'
        type: string
        required: true
      release_id:
        description: 'Numeric GitHub Release ID of the existing draft'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: recover-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate approved version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require manual dispatch from main
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || exit 1
      - name: Check out approved main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate version and requested draft ID
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python scripts/release_automation.py check --version "$RELEASE_VERSION"
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || exit 1

  audit:
    name: Verify current supply-chain baseline
    needs: preflight
    uses: ./.github/workflows/security-audit.yml
    permissions:
      contents: read

  publish:
    name: Verify existing attestation and publish recovered draft
    needs: audit
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check secure GitHub CLI version
        run: |
          GH_VERSION=$(gh --version | head -n1 | awk '{print $3}')
          [[ "$(printf '%s\n' '2.102.0' "$GH_VERSION" | sort -V | head -n1)" == '2.102.0' ]] || exit 1

      - name: Validate draft identity, original source and tag absence
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          source_sha=$(jq -r '.target_commitish' <<< "$metadata")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          jq -e --arg version "$RELEASE_VERSION" --arg sha "$source_sha" '
            .draft == true and .tag_name == $version and .target_commitish == $sha and
            (.body | contains("Source commit: " + $sha)) and
            ((.assets | map(.name) | sort) ==
             (["agentic-engineering-" + $version + ".zip",
               "agentic-engineering-" + $version + ".zip.sha256",
               "attestation-verification.json"] | sort)) and
            (.assets | all(.state == "uploaded"))
          ' <<< "$metadata" >/dev/null
          ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$GITHUB_SHA" --jq '.status')
          if [[ "$ancestry" != 'ahead' && "$ancestry" != 'identical' ]]; then
            echo 'Draft commit is not an ancestor of main' >&2
            exit 1
          fi
          tag_status=$(curl --silent --show-error --max-time 20 \
            --output "$RUNNER_TEMP/recovery-tag.json" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION")
          if [[ "$tag_status" != '404' ]]; then
            echo "Expected absent tag, received HTTP $tag_status" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Fetch exact draft assets and verify recorded SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          mkdir -p "$RUNNER_TEMP/recovery-assets"
          for name in "agentic-engineering-$RELEASE_VERSION.zip" \
                      "agentic-engineering-$RELEASE_VERSION.zip.sha256" \
                      "attestation-verification.json"; do
            asset_id=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' <<< "$metadata")
            [[ "$asset_id" =~ ^[0-9]+$ ]] || exit 1
            local_file="$RUNNER_TEMP/recovery-assets/$name"
            curl --fail --silent --show-error --location --retry 3 --max-time 90 \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              --output "$local_file"
            local_hash=$(sha256sum "$local_file" | awk '{print $1}')
            published_hash=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest' <<< "$metadata")
            if [[ "$published_hash" != "sha256:$local_hash" ]]; then
              echo "Asset digest mismatch: $name" >&2
              exit 1
            fi
          done
          (cd "$RUNNER_TEMP/recovery-assets" && \
            sha256sum -c "agentic-engineering-$RELEASE_VERSION.zip.sha256")

      - name: Verify old attestation signature, signer and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.draft.outputs.source_sha }}
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/heads/main"
          gh attestation verify "$RUNNER_TEMP/recovery-assets/agentic-engineering-$RELEASE_VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$identity" \
            --source-ref refs/heads/main \
            --source-digest "$SOURCE_SHA" --format json \
            > "$RUNNER_TEMP/recovery-verification.json"
          jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/recovery-verification.json" >/dev/null

      - name: Publish verified draft and verify Git tag target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ steps.draft.outputs.source_sha }}
        run: |
          published=$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false)
          jq -e --arg v "$RELEASE_VERSION" --arg sha "$SOURCE_SHA" '
            .draft == false and .tag_name == $v and .target_commitish == $sha and .published_at != null
          ' <<< "$published" >/dev/null
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION")
          tag_type=$(jq -r '.object.type' <<< "$tag")
          tag_sha=$(jq -r '.object.sha' <<< "$tag")
          if [[ "$tag_type" == 'tag' ]]; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          elif [[ "$tag_type" != 'commit' ]]; then
            exit 1
          fi
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || exit 1
          echo "Recovered release $RELEASE_VERSION, source $SOURCE_SHA"
