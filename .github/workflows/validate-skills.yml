name: Validate skills

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and validate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / Python 3.11
            os: ubuntu-latest
            python: "3.11"
          - label: Windows / Python 3.13
            os: windows-latest
            python: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Validate skills and local references
        run: python scripts/validate_skills.py --require-skills

      - name: Validate behavioral scenario coverage and records
        run: python scripts/evaluate_scenarios.py check
