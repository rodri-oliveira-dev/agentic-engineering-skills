name: Supply chain audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  audit:
    name: SCA, SBOM and provenance inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install pinned audit tool and project dependencies
        run: python -m pip install --index-url https://pypi.org/simple 'pip-audit==2.10.1' -r requirements.txt

      - name: Record tool version
        run: |
          mkdir -p "$RUNNER_TEMP/supply-chain"
          python -m pip_audit --version > "$RUNNER_TEMP/supply-chain/auditor-version.txt"

      - name: Audit Python dependency advisories
        id: sca
        continue-on-error: true
        run: python -m pip_audit --vulnerability-service pypi --requirement requirements.txt --format json --output "$RUNNER_TEMP/supply-chain/sca-report.json"

      - name: Create CycloneDX Python SBOM
        id: sbom
        continue-on-error: true
        run: python -m pip_audit --vulnerability-service pypi --requirement requirements.txt --format cyclonedx-json --output "$RUNNER_TEMP/supply-chain/sbom.cdx.json"

      - name: Verify canonical plugin and generated package
        id: package
        run: |
          python scripts/package_plugins.py check
          python scripts/package_plugins.py verify

      - name: Check PyPI distribution digest and inventory action references
        id: inventory
        run: |
          mkdir -p "$RUNNER_TEMP/pypi-wheels"
          python -m pip download --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/pypi-wheels" -r requirements.txt
          python scripts/supply_chain_evidence.py inventory --wheel-dir "$RUNNER_TEMP/pypi-wheels" --output "$RUNNER_TEMP/supply-chain/provenance-inventory.json"

      - name: Upload audit evidence even when checks fail
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supply-chain/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce audit result
        if: always()
        env:
          SCA: ${{ steps.sca.outcome }}
          SBOM: ${{ steps.sbom.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
        run: |
          for result in "$SCA" "$SBOM" "$PACKAGE" "$INVENTORY" "$EVIDENCE"; do
            if [[ "$result" != 'success' ]]; then
              echo 'Supply-chain check failed or was not completed; review the evidence artifact and job logs.' >&2
              exit 1
            fi
          done
          echo 'SCA, CycloneDX SBOM, package integrity and provenance inventory passed.'

  release-package:
    name: Build release candidate (read-only)
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.stage.outputs.artifact-id }}

    steps:
      - name: Check out event commit (not mutable tag name)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Verify plugin inputs before packaging
        run: |
          python scripts/package_plugins.py check
          python scripts/package_plugins.py verify

      - name: Build deterministic release archive and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/supply_chain_evidence.py package --tag "$RELEASE_TAG" --output "dist/agentic-engineering-$(printf %s "$RELEASE_TAG").zip"
          cd dist
          sha256sum -c ./*.sha256

      - name: Stage immutable candidate artifact
        id: stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90

  release-provenance:
    name: Attest and publish release (privileged)
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: release-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download exactly the verified build-job artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release-package.outputs.artifact_id }}
          path: dist
          digest-mismatch: error

      - name: Verify downloaded checksum and event tag integrity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum -c ./*.sha256
          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          ref_type=$(jq -r '.object.type' <<< "$ref_json")
          ref_sha=$(jq -r '.object.sha' <<< "$ref_json")
          if [[ "$ref_type" == "tag" ]]; then
            ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq '.object.sha')
          elif [[ "$ref_type" != "commit" ]]; then
            echo "Unsupported tag object type" >&2
            exit 1
          fi
          if [[ "$ref_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag no longer resolves to the triggering commit" >&2
            exit 1
          fi

      - name: Attest the verified archive bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/agentic-engineering-*.zip

      - name: Attach attested package and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --repo "$GITHUB_REPOSITORY"
